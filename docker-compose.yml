services:
  # Sentiment Service (Python - FastAPI/Uvicorn & Celery worker)
  sentiment-service:
    build:
      context: ./sentiment-service
    container_name: sentimind-sentiment
    ports:
      - "8030:8030"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-rpc://}
    depends_on:
      - rabbitmq
    networks:
      - sentimind-network

  # RabbitMQ Broker for Celery Sentiment Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sentimind-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sentimind-network

  # Collector Service (Node.js) - gathers social mentions and publishes to Celery
  collector-service:
    build:
      context: ./collector-service
    container_name: sentimind-collector
    ports:
      - "8021:8021"
    environment:
      - NODE_ENV=production
      - PORT=8021
      - MONGODB_URI=${MONGODB_URI}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - SENTIMENT_SERVICE_URL=http://sentiment-service:8030
      - TWITTER_API_KEY=${TWITTER_API_KEY:-}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET:-}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN:-}
      - TWITTER_ACCESS_SECRET=${TWITTER_ACCESS_SECRET:-}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-SentiMind/1.0}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - NEWSAPI_KEY=${NEWSAPI_KEY:-}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      - NEWSDATA_API_KEY=${NEWSDATA_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX:-}
    depends_on:
      - sentiment-service
      - rabbitmq
    networks:
      - sentimind-network

  # PostgreSQL for SentiMind Auth & Projects
  postgres:
    image: postgres:16-alpine
    container_name: sentimind-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Padhit@13}
      POSTGRES_DB: brand_auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentimind-network

  # Unified Backend API (Auth, Projects, AI Agents, Razorpay & Downstream Proxy)
  backend:
    build:
      context: ./backend
    container_name: sentimind-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - REFRESH_TOKEN_EXPIRY_DAYS=${REFRESH_TOKEN_EXPIRY_DAYS:-7}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80
      - COLLECTOR_SERVICE_URL=http://collector-service:8021
      - SENTIMENT_SERVICE_URL=http://sentiment-service:8030
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      collector-service:
        condition: service_started
    networks:
      - sentimind-network

  # Frontend (React + Vite SPA)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_GATEWAY_URL: http://localhost:8000
    container_name: sentimind-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sentimind-network

volumes:
  postgres_data:

networks:
  sentimind-network:
    driver: bridge
